# 2026-09-03: claim SQL is now watermark-gated. Read this before touching
# models, or before bulk-writing images.completed_at.
#
# WHY: the claim SQL is an anti-join, so "confirm there is no work" used to
# cost O(all done rows, millions) -- 60.6s of 100% CPU every cycle, forever,
# producing nothing (measured 70% duty, 139,821 read syscalls/sec, GPU 0%,
# log counters frozen for 2h42m). The old dino-enable.conf note that the
# "claim SQL bottoms out naturally" was wrong: bottoming out is exactly when
# it starts burning a core for nothing.
#
# HOW: each cycle first reads MAX(completed_at) WHERE status='done' -- O(1)
# via idx_images_done_completed (status, completed_at). Unchanged high-water
# mark => nothing became 'done' since the last confirmed-empty scan => skip
# the anti-join. When it does scan, it is bounded by completed_at > watermark
# minus WATERMARK_OVERLAP_S. Result: 60.6s -> 0.027s, 70% duty -> 0%.
#
# TWO WAYS TO SILENTLY LOSE WORK -- both need a restart:
#   1. Adding/removing a model tag (DINO_ENABLED, *_TAG). Existing rows keep
#      their old completed_at, so the watermark skips them and the new model
#      is never backfilled. The watermark is in-memory ON PURPOSE: restart
#      resets it to None, which forces one full rescan.
#   2. Bulk-writing a HISTORICAL completed_at (a backfill that preserves the
#      original download time instead of stamping now). Those rows sort below
#      the watermark and are skipped.
#
# REQUIRED INDEX -- without it the probe is 5.88s and the bounded claim
# degrades to a full scan:
#   CREATE INDEX IF NOT EXISTS idx_images_done_completed
#       ON images(status, completed_at);
#
# Rollback: /data/ml/dataset/embed_daemon_combined.py.bak-20260903
