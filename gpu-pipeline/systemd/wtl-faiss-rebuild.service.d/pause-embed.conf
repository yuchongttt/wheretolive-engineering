[Service]
# The embed daemon was a user-level service (uid 1000) when this was written, so
# a system-level rebuild has to go through `su wtl` + XDG_RUNTIME_DIR to reach
# it. A plain (system-level) `systemctl stop` cannot stop a user service ->
# "Interactive authentication required" -> ExecStartPre fails -> the whole
# rebuild aborts (it failed every Saturday from 2026-06-06). ExecStartPre has a
# `-` prefix so the rebuild is not aborted even if embed is already gone (e.g.
# killed by earlyoom).
ExecStartPre=-/bin/su wtl -c 'XDG_RUNTIME_DIR=/run/user/1000 systemctl --user stop wtl-embed-combined.service'
# Override the main unit's ExecStartPost (restart wtl-dino-server): DINO was taken
# off the GPU box on 2026-05-29 (pending a move to a new host); restarting a
# service that is offline fails and aborts the following embed start (reproduced:
# embed did not come back). After clearing, only one step remains: restart the
# embed daemon. When dino returns to the GPU box, this dino restart has to be
# restored.
ExecStartPost=
ExecStartPost=/bin/su wtl -c 'XDG_RUNTIME_DIR=/run/user/1000 systemctl --user start wtl-embed-combined.service'
