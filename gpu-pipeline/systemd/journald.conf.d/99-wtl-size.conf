# 2026-09-07: journald's default cap is 10% of the filesystem, which on this
# machine = 21.6G, and the root volume is the tight SSD (216G, with backups 41G +
# dataset.db 39G + dino 16G all on it). Usage at the time was 3.2G, so setting 4G
# deletes no log right now; it only lowers the future ceiling from 21.6G.
[Journal]
SystemMaxUse=4G
