[Service]
# Dino is user-facing (image_search). Even though it briefly mmaps ~9 GB
# at startup, killing it triggers a death spiral when systemd-oomd picks
# it as the biggest swap-user. Let kernel-level OOM handle it as last
# resort instead; batch workloads (embed-combined / faiss-rebuild) are
# the right kill targets.
ManagedOOMSwap=auto
